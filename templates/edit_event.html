{% extends "base.html" %}
{% block title %}{{ t('events.edit_title') }}{% endblock %}
{% block back_nav %}
<a class="btn-back" href="{{ url_for('view_event', event_id=event.id) }}">← {{ t('common.back') }}</a>
{% endblock %}
{% block content %}
<div class="card">
    <h2>{{ t('events.edit_title') }}</h2>
    <form method="POST">
        <label>{{ t('events.title_label') }}</label>
        <input type="text" name="title" value="{{ event.title }}" required>

        <label>{{ t('events.description_label') }}</label>
        <textarea name="description" rows="3">{{ event.description or '' }}</textarea>

        <label>{{ t('events.sport_type_label') }}</label>
        <select name="sport_type">
            {% for value, icon, label in sport_choices %}
            <option value="{{ value }}" {{ "selected" if event.sport_type == value else "" }}>{{ icon }} {{ t(label) }}</option>
            {% endfor %}
        </select>

        <label>{{ t('events.prize_type_label') }}</label>
        <select name="prize_type" id="prize-type-select">
            <option value="money" {{ "selected" if event.prize_type == "money" else "" }}>{{ t('events.prize_type_money') }}</option>
            <option value="voucher" {{ "selected" if event.prize_type == "voucher" else "" }}>{{ t('events.prize_type_voucher') }}</option>
            <option value="mixed" {{ "selected" if event.prize_type == "mixed" else "" }}>{{ t('events.prize_type_mixed') }}</option>
        </select>

        <div id="prize-pool-group">
            <label>{{ t('events.prize_pool_label') }}</label>
            <input type="number" step="0.01" name="prize_pool" id="prize-pool-input" value="{{ event.prize_pool }}" required>
        </div>

        <div id="voucher-count-group">
            <label>{{ t('events.voucher_count_label') }}</label>
            <input type="number" step="1" min="1" name="voucher_count" id="voucher-count-input" value="{{ event.voucher_count or '' }}" placeholder="{{ t('events.voucher_count_placeholder') }}">
        </div>

        <label>{{ t('events.sponsor_label') }}</label>
        <select name="sponsor_spin_id">
            <option value="">{{ t('events.no_sponsor_option') }}</option>
            {% for s in sponsors %}
            <option value="{{ s.id }}" {{ "selected" if event.sponsor_spin_id == s.id else "" }}>{{ s.sponsor_name }}</option>
            {% endfor %}
        </select>

        <label>{{ t('events.match_date_label') }}</label>
        <input type="datetime-local" name="match_date" value="{{ event.match_date.strftime('%Y-%m-%dT%H:%M') }}" required>

        <button class="btn" type="submit">{{ t('common.save_changes') }}</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const typeSelect = document.getElementById("prize-type-select");
    const poolGroup = document.getElementById("prize-pool-group");
    const poolInput = document.getElementById("prize-pool-input");
    const countGroup = document.getElementById("voucher-count-group");
    const countInput = document.getElementById("voucher-count-input");

    function updatePrizeFields() {
        const type = typeSelect.value;
        const showPool = type === "money" || type === "mixed";
        const showCount = type === "voucher" || type === "mixed";

        poolGroup.style.display = showPool ? "" : "none";
        poolInput.required = showPool;

        countGroup.style.display = showCount ? "" : "none";
        countInput.required = showCount;
    }

    typeSelect.addEventListener("change", updatePrizeFields);
    updatePrizeFields();
})();
</script>
{% endblock %}
