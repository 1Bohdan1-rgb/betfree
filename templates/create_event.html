{% extends "base.html" %}
{% block title %}{{ t('events.create_title') }}{% endblock %}
{% block back_nav %}
<a class="btn-back" href="{{ url_for('dashboard') }}">← {{ t('common.back') }}</a>
{% endblock %}
{% block content %}
<div class="card">
    <h2>{{ t('events.create_title') }}</h2>
    <form method="POST">
        <label>{{ t('events.title_label') }}</label>
        <input type="text" name="title" required>

        <label>{{ t('events.description_label') }}</label>
        <textarea name="description" rows="3"></textarea>

        <label>{{ t('events.sport_type_label') }}</label>
        <select name="sport_type">
            {% for value, icon, label in sport_choices %}
            <option value="{{ value }}">{{ icon }} {{ t(label) }}</option>
            {% endfor %}
        </select>

        <label>{{ t('events.prize_pool_label') }}</label>
        <input type="number" step="0.01" name="prize_pool" required>

        <label>{{ t('events.prize_type_label') }}</label>
        <select name="prize_type">
            <option value="money">{{ t('events.prize_type_money') }}</option>
            <option value="voucher">{{ t('events.prize_type_voucher') }}</option>
            <option value="mixed">{{ t('events.prize_type_mixed') }}</option>
        </select>

        <label>{{ t('events.voucher_count_label') }}</label>
        <input type="number" step="1" min="1" name="voucher_count" placeholder="{{ t('events.voucher_count_placeholder') }}">

        <label>{{ t('events.sponsor_label') }}</label>
        <select name="sponsor_spin_id">
            <option value="">{{ t('events.no_sponsor_option') }}</option>
            {% for s in sponsors %}
            <option value="{{ s.id }}">{{ s.sponsor_name }}</option>
            {% endfor %}
        </select>

        <label>{{ t('events.match_date_label') }}</label>
        <input type="datetime-local" name="match_date" required>

        <label>{{ t('events.options_label') }}</label>
        <label>{{ t('events.option_n', n=1) }}</label>
        <input type="text" name="options" required>
        <label>{{ t('events.option_n', n=2) }}</label>
        <input type="text" name="options" required>
        <label>{{ t('events.option_3_optional') }}</label>
        <input type="text" name="options">

        <button class="btn" type="submit">{{ t('events.create_submit') }}</button>
    </form>
</div>
{% endblock %}
